; ******************************************************************************************
; working environment for template of custom firmware
; ******************************************************************************************
; Common build settings across this custom device
[env_NPGauge]
build_flags =
	${env.build_flags}												; include standard build flags
	-DMF_CUSTOMDEVICE_SUPPORT=1										; Required for Custom Devices
	-DMF_CUSTOMDEVICE_HAS_UPDATE									; if the custom device needs to be updated, uncomment this. W/o the following define it will be done each loop()
	-DMF_CUSTOMDEVICE_POLL_MS=5 									; time in ms between updating custom device, uncomment this if custom device needs to be updated regulary
	;-DHAS_CONFIG_IN_FLASH											; undefine this and add your configuration to MFCustomDevicesConfig.h to save the config in Flash !!Core FW version must be at least 2.5.2!!
	-I./src/src/MF_CustomDevice										; don't change this one!
	-I./NPGauge													; Include files for your custom device, replace "NPGauge" by your folder name
build_src_filter = 
	+<../NPGauge>													; build files for your custom device, replace "NPGauge" by your folder name
lib_deps =															; You can add additional libraries if required
	bodmer/TFT_eSPI@^2.5.43
custom_core_firmware_version = 2.5.1								; define the version from the core firmware files your build should base on
custom_source_folder = NPGauge										; path to your Custom Device Sources, replace "NPGauge" by your folder name
custom_community_project = 	saves_NPGauge								; Folder name inside zip file, also ZIP file name if "custom_zip_filename" is not changed
custom_zip_filename = ${env_NPGauge.custom_community_project}		; Name of the zip-file, overwrite it to define an different zip-file name

; Build settings for the Raspberry Pico with Custom Firmware NPGauge
[env:saves_npgauge_raspberrypico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0M
lib_ldf_mode = chain+
upload_protocol = mbed
build_flags =
	${env_NPGauge.build_flags}										; don't change this one!
	-I./src/_Boards/RaspberryPi/Pico								; Include the required board definition. If you need your own definition, adapt this to your path (e.g. -I./CustomDevices/_template/_Boards)
	'-DMOBIFLIGHT_TYPE="saves NPGauge RaspiPico"'				; this must match with "MobiFlightType" within the .json file
	'-DMOBIFLIGHT_NAME="saves NPGauge"'						; this will show up as Name in the settings dialog unless it gets change from there
	-D USER_SETUP_LOADED=1
	-D GC9A01_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MOSI=19
	-D TFT_SCLK=18
	-D TFT_CS=17
	-D TFT_DC=20
	-D TFT_RST=21
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D TFT_BL=16
	-D TFT_RGB_ORDER=TFT_RGB
	-D TFT_BACKLIGHT_ON=HIGH
	-D TFT_INVERSION_ON=1
    -DMF_SEGMENT_SUPPORT=0
    -DMF_LCD_SUPPORT=0
    -DMF_STEPPER_SUPPORT=0
    -DMF_SERVO_SUPPORT=0
    -DMF_ANALOG_SUPPORT=0
    -DMF_OUTPUT_SHIFTER_SUPPORT=0
    -DMF_INPUT_SHIFTER_SUPPORT=0
    -DMF_MUX_SUPPORT=0
    -DMF_DIGIN_MUX_SUPPORT=0
build_src_filter =
	${env.build_src_filter}											; don't change this one!
	${env_NPGauge.build_src_filter}								; don't change this one!
lib_deps =
	${env.lib_deps}													; don't change this one!
	${env_NPGauge.lib_deps}										; don't change this one!
	${env.custom_lib_deps_Pico}										; don't change this one!
monitor_speed = 115200												; don't change this one!
extra_scripts = 
	${env.extra_scripts}											; don't change this one!
custom_core_firmware_version = ${env_NPGauge.custom_core_firmware_version}	; don't change this one!
custom_community_project = ${env_NPGauge.custom_community_project}			; don't change this one!
custom_source_folder = ${env_NPGauge.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_NPGauge.custom_zip_filename}			; don't change this one!
